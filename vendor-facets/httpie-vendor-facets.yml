# Vendor facets — HTTPie. The open-source HTTP CLI plus a desktop/web app (public beta) with
# collections and a versioned JSON export format. Nothing it ships is a Postman collection, a hosted
# docs page, a console, a contract or an MCP server for the provider's API, so it earns a provider's
# Kin Score next to nothing. That is the finding, not a gap in the research.
vendor: httpie
name: HTTPie
website: https://httpie.io
areas:
- api-collections
registry_keys: []
rubric_schema_version: 0.22.0
generated: '2026-09-25'
features_refreshed: '2026-09-25'
basis: capability
summary: >-
  HTTPie makes calling an API pleasant; it does not publish anything a provider's score reads. Its collections
  export to HTTPie's own JSON format (with a public schema), not to Postman or OpenAPI, so postman_present
  and contract_present are out of reach, and the HTTPie CLI is HTTPie's, not the provider's. The one conditional
  route is a published export used as an example corpus. A provider adopting HTTPie should expect no score
  movement.
features:
- id: httpie-cli
  name: HTTPie CLI
  description: Open-source command-line HTTP client, installable from the common package managers.
  source: https://httpie.io/
  tier: open-source
- id: desktop-app
  name: HTTPie for Web and Desktop
  description: Graphical client (public beta) with collections, environments, path parameters and copy-as-command.
  source: https://httpie.io/
  tier: all
- id: json-export
  name: Versioned JSON export
  description: >-
    Spaces, environments, collections and requests export to a versioned JSON format with a JSON Schema,
    meant for backup, sharing, interoperability and publishing; requests also export as cURL or HTTPie
    commands.
  source: https://httpie.io/docs/desktop/export
  tier: all
maps:
- feature: json-export
  check: examples_published
  layer: composite
  conditional: true
  condition: >-
    Only if the provider publishes an exported collection that covers real calls with real payloads and
    declares it as Examples. The export is a request set, not a Postman collection or a contract.
  catalog_pass_rate: 0.052
  facet: contract_quality
  points: 4
  baseline_pass_rate: 0.127
earns_nothing:
- feature: json-export
  check: postman_present
  why: HTTPie exports its own JSON format; the check reads Postman-typed pointers only.
- feature: httpie-cli
  check: cli_present
  why: >-
    The HTTPie CLI is a general HTTP client, not a command-line interface the provider publishes for its
    API.
out_of_reach:
  checks:
  - contract_present
  - documentation_present
  - console_or_sandbox
  - llms_txt_published
  - agent_skill_present
  note: >-
    No fetched page offers OpenAPI export, hosted docs, a public console or mock, llms.txt or Agent Skills
    for the provider.
surface:
  contract_quality:
    reachable: 4.0
    total: 211
  agent_readiness:
    reachable: 0
    total: 139
hard_rule: >-
  A model, not a score. Adopting this vendor changes a provider's Kin Score only when the provider publishes
  the resulting artifacts on its own surface; nothing here writes a score, and no sponsorship or partnership
  can.
method: searched
source:
- https://httpie.io/
- https://httpie.io/docs/desktop/export
measured:
  cohort:
    method: vendors-catalog.json detections (CNAME / header / URL shape / markup), never a name match
    detected: 0
    in_baseline: 0
  control:
    basis: providers earning contract_present + documentation_present + api_reference_present, minus the
      cohort
    n: 5216
  metric: >-
    cohort_pct / control_pct = mean share of the check's points earned (derived and platform credit weighted),
    x100
  measured_on: '2026-09-25'
  status: 'not measurable: 0 detected customers clear the baseline (need 20)'
simulation:
  simulated_on: '2026-09-25'
  rubric: 0.23.0
  population: providers publishing a contract (contract_present earned), replayable exactly
  providers: 8977
  providers_unreplayable: 987
  providers_moved: 0
  conditional_rows: excluded (they depend on what the API already does)
  composite_lift:
    median: 0.0
    p75: 0.0
    p90: 0.0
    max: 0.0
    mean_among_movers: 0.0
  agent_readiness_lift:
    median: 0.0
    p75: 0.0
    p90: 0.0
    max: 0.0
    mean_among_movers: 0.0
  facet_lift_median_among_movers: {}
  composite_band_moves: {}
  agent_readiness_band_moves: {}
  method: >-
    each provider's own kin/checks file, the vendor's maps at their stated credit, the scorer's composite
    formula; from -> to, nothing written
