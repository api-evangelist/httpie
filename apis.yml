aid: httpie
name: HTTPie
description: >-
  HTTPie is a user-friendly command-line and web-based HTTP client designed for testing, debugging, and interacting with
  APIs and HTTP services. It provides expressive syntax that mirrors actual HTTP requests, formatted and
  syntax-highlighted output, native JSON support, file uploads, form submissions, persistent sessions, multiple
  authentication schemes (basic, digest, bearer, .netrc, and an extensible plugin system covering OAuth, AWS, NTLM, and
  more), download mode similar to wget, HTTPS and proxy support, and cross-platform installation across Linux, macOS,
  Windows, and FreeBSD. The companion HTTPie web app and Desktop client layer a graphical interface over the same
  request and response model that the CLI exposes.
